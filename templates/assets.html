<!DOCTYPE html>
<html>
<head>
    <title>Assets Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Assets Management</h1>
    <nav>
        <a href="/dashboard">Dashboard</a> |
        <a href="/assets">Assets</a> |
        <a href="/vpcs">VPCs</a> |
        <a href="/security_groups">Security Rules</a> |
        <a href="/alerts">Alerts</a> |
        <a href="/logs">Logs</a>
    </nav>
    <hr>
    <h2>Add Asset</h2>
    <form action="/add_asset" method="POST">
        <label>Asset Name:</label><br>
        <input type="text" name="asset_name" required><br><br>
        <label>Asset Type:</label><br>
        <input type="text" name="asset_type" required><br><br>
        <label>Location:</label><br>
        <input type="text" name="location" required><br><br>
        <label>Status:</label><br>
        <select name="status">
            <option>Active</option>
            <option>Inactive</option>
            <option>Maintenance</option>
        </select><br><br>
        <button type="submit">Add Asset</button>
    </form>
    <hr>
    <h2>Asset List</h2>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Asset Name</th>
            <th>Asset Type</th>
            <th>Location</th>
            <th>Status</th>
        </tr>
        {% for asset in assets %}
        <tr>
            <td>{{ asset[0] }}</td>
            <td>{{ asset[1] }}</td>
            <td>{{ asset[2] }}</td>
            <td>{{ asset[3] }}</td>
            <td>{{ asset[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
