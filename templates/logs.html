<!DOCTYPE html>
<html>
<head>
    <title>Activity Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h1>Activity Logs</h1>
<nav>
    <a href="/dashboard">Dashboard</a> |
    <a href="/assets">Assets</a> |
    <a href="/vpcs">VPCs</a> |
    <a href="/security_groups">Security Rules</a> |
    <a href="/alerts">Alerts</a> |
    <a href="/logs">Logs</a>
</nav>
<hr>
<h2>System Logs</h2>
<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Activity</th>
        <th>Date & Time</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log[0] }}</td>
        <td>{{ log[1] }}</td>
        <td>{{ log[2] }}</td>
        <td>{{ log[3] }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
