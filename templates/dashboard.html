<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Security Dashboard</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        body{
            background:#f4f6f9;
        }
        .navbar{
            background:#1e293b;
            padding:15px;
            text-align:center;
        }
        .navbar a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }
        .header{
            text-align:center;
            padding:30px;
        }
        .header h1{
            color:#1e293b;
        }
        .cards{
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
            margin-top:20px;
        }
        .card{
            width:220px;
            padding:25px;
            border-radius:15px;
            color:white;
            text-align:center;
            box-shadow:0px 4px 12px rgba(0,0,0,0.2);
        }
        .assets{
            background:#2563eb;
        }
        .vpcs{
            background:#16a34a;
        }
        .rules{
            background:#f59e0b;
        }
        .alerts{
            background:#dc2626;
        }
        .card h2{
            font-size:18px;
        }
        .card p{
            font-size:40px;
            margin-top:15px;
            font-weight:bold;
        }
        .footer{
            margin-top:50px;
            text-align:center;
            color:gray;
        }
    </style>
</head>
<body>
    <h2 id="greeting"></h2>
    <p id="datetime"></p>
    <div class="navbar">
        <a href="/dashboard">Dashboard</a>
        <a href="/assets">Assets</a>
        <a href="/vpcs">VPCs</a>
        <a href="/security_groups">Security Rules</a>
        <a href="/alerts">Alerts</a>
        <a href="/logs">Logs</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="header">
        <h1>🛡️ Hybrid Security Dashboard</h1>
        <br>
        <p>Welcome {{ session['username'] }}</p>
    </div>
    <div class="cards">
        <div class="card assets">
            <h2>💻 Assets</h2>
            <p>{{ asset_count }}</p>
        </div>
        <div class="card vpcs">
            <h2>🌐 VPCs</h2>
            <p>{{ vpc_count }}</p>
        </div>
        <div class="card rules">
            <h2>🔒 Security Rules</h2>
            <p>{{ rule_count }}</p>
        </div>
        <div class="card alerts">
            <h2>🚨 Alerts</h2>
            <p>{{ alert_count }}</p>
        </div>
    </div>
    <div class="footer">
        <h3>Hybrid Security Monitoring System</h3>
    </div>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
